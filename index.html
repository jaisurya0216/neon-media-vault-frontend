<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Neon Media Vault</title>

<!-- 🔐 AUTH CHECK -->
<script src="auth.js"></script> 
<script> checkAuth(); </script>
<style>
:root {
  --neon1: #00ffff;
  --neon2: #7f5cff;
  --bg1: #050510;
  --bg2: #0b0b22;
  --glass: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.15);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 20% 10%, #1b1b55, transparent 40%),
    radial-gradient(circle at 80% 80%, #3a1c6b, transparent 40%),
    linear-gradient(180deg, var(--bg2), var(--bg1));
  font-family: "Inter", "Segoe UI", monospace;
  color: white;
}

/* HEADER */
header {
  padding: 28px;
  text-align: center;
  font-size: 34px;
  letter-spacing: 3px;
  background: linear-gradient(90deg, var(--neon1), var(--neon2));
  -webkit-background-clip: text;
  color: transparent;
  text-shadow: 0 0 20px rgba(127,92,255,.6);
}

/* SEARCH */
.search {
  max-width: 620px;
  margin: 0 auto 30px;
}

.search input {
  width: 100%;
  padding: 14px 18px;
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 14px;
  backdrop-filter: blur(15px);
  color: white;
  font-size: 16px;
  outline: none;
}

/* GRID */
.grid {
  padding: 30px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 30px;
}

/* CARD */
.card {
  position: relative;
  background: linear-gradient(
    145deg,
    rgba(255,255,255,0.12),
    rgba(255,255,255,0.02)
  );
  backdrop-filter: blur(20px);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 12px;
  transition: transform .3s ease, box-shadow .3s ease;
  cursor: pointer;
}

.card:hover {
  transform: translateY(-10px) scale(1.05);
  box-shadow:
    0 0 25px rgba(0,255,255,.5),
    0 0 60px rgba(127,92,255,.4);
}

/* MEDIA */
.media {
  width: 100%;
  height: 160px;
  border-radius: 12px;
  overflow: hidden;
}

.media video {
  width: 100%;
  height: 100%;
  object-fit: cover;   /* keep videos cropped (looks nicer) */
}

.media img {
  width: 100%;
  height: 100%;
  object-fit: contain; /* show full image */
  background: #0b0b22; /* nice letterbox */
}

/* NAME */
.name {
  margin-top: 10px;
  font-size: 14px;
  text-shadow: 0 0 8px rgba(0,255,255,.6);
}

/* BADGES */
.badge {
  position: absolute;
  top: 10px;
  left: 10px;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 6px;
  background: rgba(0,0,0,.6);
}

.badge.cloudinary { color:#00ffff; border:1px solid #00ffff; }
.badge.drive { color:#7f5cff; border:1px solid #7f5cff; }

.size {
  position: absolute;
  bottom: 10px;
  right: 10px;
  font-size: 11px;
  opacity: .85;
}

/* VIEWER */
.viewer {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.viewer.hidden { display:none; }

#viewerContent img {
  max-width: 95vw;
  max-height: 90vh;
  object-fit: contain;
}

#viewerContent video,
#viewerContent iframe {
  max-width: 90vw;
  max-height: 80vh;
}

#closeViewer {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 28px;
  cursor: pointer;
}

#downloadBtn {
  margin-top: 16px;
  color: #00ffff;
  border: 1px solid #00ffff;
  padding: 8px 16px;
  border-radius: 10px;
  text-decoration: none;
}

.drive-placeholder {
  width: 100%;
  height: 100%;
  background: linear-gradient(
    135deg,
    rgba(127,92,255,0.25),
    rgba(0,255,255,0.15)
  );
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  color: #7f5cff;
  text-shadow: 0 0 12px rgba(127,92,255,.8);
}

.filters {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 20px;
}

.filter-btn {
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid rgba(0,255,255,.6);
  background: rgba(0,0,0,0.4);
  color: #00ffff;
  cursor: pointer;
  font-size: 14px;
  transition: all .25s ease;
  text-shadow: 0 0 6px rgba(0,255,255,.6);
}

.filter-btn:hover {
  box-shadow: 0 0 14px rgba(0,255,255,.6);
}

.filter-btn.active {
  background: linear-gradient(90deg, #00ffff, #7f5cff);
  color: black;
  font-weight: 600;
  box-shadow:
    0 0 18px #00ffff,
    0 0 36px #7f5cff;
}


</style>
</head>

<body>

<header>⚡ NEON MEDIA VAULT</header>

<div class="search">
  <input id="search" placeholder="Search your vault…" />
</div>
<div class="filters">
  <button class="filter-btn active" data-type="all">All</button>
  <button class="filter-btn" data-type="image">Images</button>
  <button class="filter-btn" data-type="video">Videos</button>

  <!-- ✅ NEW SORT DROPDOWN -->
  <select id="sortSelect" class="filter-btn">
    <option value="newest">Newest</option>
    <option value="oldest">Oldest</option>
    <option value="name">Name (A–Z)</option>
    <option value="size">Size (Large→Small)</option>
  </select>
</div>

<div class="grid" id="grid"></div>

<!-- VIEWER -->
<div id="viewer" class="viewer hidden">
  <span id="closeViewer">✕</span>
  <div id="viewerContent"></div>
  <a id="downloadBtn" target="_blank">⬇ Download</a>
</div>

<script>
const grid = document.getElementById("grid");
const search = document.getElementById("search");
const sortSelect = document.getElementById("sortSelect");

sortSelect.onchange = () => {
  currentSort = sortSelect.value;
  render();
};
let currentSort = "newest";
let currentFilter = "all";

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.type;
    render();
  };
});

let currentIndex = -1;
let visibleFiles = [];
  
let allFiles = [];

fetch("https://neon-media-vault-backend.onrender.com/files")
  .then(r => r.json())
  .then(data => {
    allFiles = [
      // CLOUDINARY (UNCHANGED)
      ...data.cloudinary.map(f => ({
        name: f.public_id.split("/").pop(),
        type: f.resource_type,
        url: f.secure_url,
        size: f.bytes,
        created_at: f.created_at
    ? new Date(f.created_at).getTime()
    : Date.now() - i,
        source: "cloudinary"
      })),

      // DRIVE (CUSTOM THUMB SUPPORT)
      ...data.drive.map(f => ({
        id: f.id,
        name: f.name,
        type: f.mimeType.startsWith("video") ? "video" : "image",
        thumb: f.thumbnailLink,
        webViewLink: f.webViewLink,
        webContentLink: f.webContentLink,
        size: f.size,
        created_at: f.created_at
    ? new Date(f.created_at).getTime()
    : Date.now() - i,
  source: "drive"
      }))
    ];
    render();
  });

search.oninput = render;

/* DRIVE CUSTOM THUMB (SAFE) */
function getDriveThumbnail(fileName) {
  return `/thumbnails/${fileName}.jpg`;
}

function render() {
  grid.innerHTML = "";
  const q = search.value.toLowerCase();

  /* ✅ FILTER FIRST */
  visibleFiles = allFiles.filter(f => {
    const matchesSearch = f.name.toLowerCase().includes(q);
    const matchesType =
      currentFilter === "all" || f.type === currentFilter;
    return matchesSearch && matchesType;
  });

  /* ✅ SORT AFTER FILTER */
  visibleFiles.sort((a, b) => {
    if (currentSort === "name") {
      return a.name.localeCompare(b.name);
    }

    if (currentSort === "size") {
      return (b.size || 0) - (a.size || 0);
    }

    if (currentSort === "oldest") {
      return (a.created_at || 0) - (b.created_at || 0);
    }

    // default newest
    return (b.created_at || 0) - (a.created_at || 0);
  });

  /* ✅ THEN RENDER */
  visibleFiles.forEach((f, i) => {
    const card = document.createElement("div");
    card.className = "card";

    const media = document.createElement("div");
    media.className = "media";

    // CLOUDINARY VIDEO
    if (f.type === "video" && f.source === "cloudinary") {
      const v = document.createElement("video");
      v.src = f.url;
      v.preload = "none";
      v.poster = f.url.replace("/upload/", "/upload/so_0/");
      v.muted = true;
      v.loop = true;
      v.playsInline = true;

      card.onmouseenter = () => v.play().catch(()=>{});
      card.onmouseleave = () => { v.pause(); v.currentTime = 0; };

      media.appendChild(v);
    }

    // DRIVE VIDEO (thumbnail only)
    else if (f.type === "video" && f.source === "drive") {
      const img = document.createElement("img");
      img.src = getDriveThumbnail(f.name);
      img.onerror = () => img.src = f.thumb;
      media.appendChild(img);
    }

    // IMAGES
    else {
      const img = document.createElement("img");
      img.src = f.source === "drive"
        ? getDriveThumbnail(f.name)
        : f.url;
      img.onerror = () => img.src = f.thumb;
      media.appendChild(img);
    }

    // ✅ index-based open
    card.addEventListener("click", (e) => {
  if (e.target.classList.contains("name")) return; // ignore rename clicks
  openViewerByIndex(i);
});

    const name = document.createElement("div");
name.className = "name";
name.textContent = f.name;

/* ✨ RENAME FEATURE */
name.ondblclick = (e) => {
  e.stopPropagation();
  const input = document.createElement("input");
  input.value = f.name;
  input.style.width = "100%";
  input.style.background = "rgba(0,0,0,.6)";
  input.style.color = "white";
  input.style.border = "1px solid #00ffff";
  input.style.borderRadius = "6px";
  input.style.padding = "4px";

  name.replaceWith(input);
  input.focus();
  input.select();

  function save() {
    const newName = input.value.trim();
    if (newName) f.name = newName; // update local only
    input.replaceWith(name);
    name.textContent = f.name;
  }

  input.onblur = save;
  input.onkeydown = e => {
    if (e.key === "Enter") save();
    if (e.key === "Escape") input.replaceWith(name);
  };
};

card.append(media, name);
    grid.appendChild(card);
  });
}

/* VIEWER (UNCHANGED) */
const viewer = document.getElementById("viewer");
const viewerContent = document.getElementById("viewerContent");
const closeViewer = document.getElementById("closeViewer");
const downloadBtn = document.getElementById("downloadBtn");

closeViewer.onclick = () => {
  viewer.classList.add("hidden");
  viewerContent.innerHTML = "";
};

function openViewer(file) {

  // ✅ GOOGLE DRIVE VIDEO (WORKS ON VERCEL)
  if (file.source === "drive" && file.type === "video") {
    const previewUrl = `https://drive.google.com/file/d/${file.id}/preview`;
    window.open(previewUrl, "_blank", "noopener,noreferrer");
    return;
  }

  viewerContent.innerHTML = "";

  // ✅ CLOUDINARY VIDEO
  if (file.type === "video") {
    const v = document.createElement("video");
    v.src = file.url;
    v.controls = true;
    v.autoplay = true;
    viewerContent.appendChild(v);
    downloadBtn.href = file.url + "?dl=true";
  }

  // ✅ IMAGE
  else {
    const img = document.createElement("img");
    img.src = file.url || file.thumb;
    viewerContent.appendChild(img);
    downloadBtn.href = file.url || file.webContentLink;
  }

  viewer.classList.remove("hidden");
}
function openViewerByIndex(index) {
  const file = visibleFiles[index];
  if (!file) return;

  currentIndex = index;

  // GOOGLE DRIVE VIDEO → keep current behavior
  if (file.source === "drive" && file.type === "video") {
    const previewUrl = `https://drive.google.com/file/d/${file.id}/preview`;
    window.open(previewUrl, "_blank", "noopener,noreferrer");
    return;
  }

  // Reuse your existing viewer logic
  openViewer(file);
}

/* NEXT / PREV */
function showNext() {
  if (currentIndex < visibleFiles.length - 1) {
    openViewerByIndex(currentIndex + 1);
  }
}

function showPrev() {
  if (currentIndex > 0) {
    openViewerByIndex(currentIndex - 1);
  }
}

/* KEYBOARD SUPPORT */
document.addEventListener("keydown", e => {
  if (viewer.classList.contains("hidden")) return;
  if (e.key === "ArrowRight") showNext();
  if (e.key === "ArrowLeft") showPrev();
});

/* MOBILE SWIPE */
let startX = 0;

viewer.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

viewer.addEventListener("touchend", e => {
  const endX = e.changedTouches[0].clientX;
  if (startX - endX > 50) showNext();
  if (endX - startX > 50) showPrev();
});
</script>


</body>
</html>
